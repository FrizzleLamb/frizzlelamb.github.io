<div id="donut-container">
  <div id="donut"></div>
  <svg id="frosting-svg" viewBox="0 0 300 300">
    <defs>
      <filter id="squiggly" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="14" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <radialGradient id="frosting-shadow-gradient" cx="50%" cy="50%" r="50%">
        <stop offset="93%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0.05" />
      </radialGradient>
      <radialGradient id="inner-hole-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="45%" stop-color="#000000" stop-opacity="0" />
        <stop offset="58%" stop-color="#000000" stop-opacity="0.15" />
        <stop offset="100%" stop-color="#000000" stop-opacity="0" />
      </radialGradient>
      <pattern id="cinnamon-dots" width="9" height="9" patternUnits="userSpaceOnUse">
        <circle cx="4.5" cy="4.5" r="0.9" fill="rgba(80,45,15,0.55)" />
      </pattern>
    </defs>
    <circle id="frosting-main" cx="150" cy="150" r="140" fill="#ffabb6" filter="url(#squiggly)" />
    <circle id="cinnamon-overlay" cx="150" cy="150" r="140" fill="url(#cinnamon-dots)" filter="url(#squiggly)" opacity="0" pointer-events="none" />
    <circle cx="150" cy="150" r="140" fill="url(#frosting-shadow-gradient)" filter="url(#squiggly)" pointer-events="none" />
    <circle cx="50%" cy="50%" r="12%" fill="url(#inner-hole-shadow)" filter="url(#squiggly)" pointer-events="none" />
  </svg>
</div>
<div class="recipe-content">
  <div class="control-group">
    <span class="label">frosting</span>
    <button class="option-btn active" data-frosting="#ffabb6">strawberry</button>
    <button class="option-btn" data-frosting="#6b3f2a">chocolate</button>
    <button class="option-btn" data-frosting="#fbeeda">vanilla</button>
    <button class="option-btn" data-frosting="#fff8f0" data-opacity="0.3">glazed</button>
    <button class="option-btn" data-frosting="#a5713a" data-cinnamon="true">cinnamon</button>
  </div>
  <div class="control-group">
    <div class="label-row">
      <span class="label">toppings </span>
      <button id="clear-btn" class="clear-mini-btn">(clear)</button>
    </div>
    <button class="option-btn active" data-shape="long">sprinkles</button>
    <button class="option-btn" data-shape="dot">nonpareils</button>
    <button class="option-btn" data-shape="pebble">pebbles</button>
    <button class="option-btn" data-shape="jimmies">jimmies</button>
  </div>
  <div class="control-group">
    <span class="label">dough</span>
    <button class="option-btn active" data-dough="#f2b070">regular</button>
    <button class="option-btn" data-dough="#4e321d">chocolate</button>
    <button class="option-btn" data-dough="#8c211d">red velvet</button>
  </div>
</div>
