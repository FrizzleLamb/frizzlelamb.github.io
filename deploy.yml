name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main  # or master

permissions:
  contents: read
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIZZLELAMB_S_WEBSITE }}'
          channelId: live
          projectId: frizzlelamb-s-website
